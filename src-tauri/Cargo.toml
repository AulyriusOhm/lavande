[package]
name = "lavande"
version = "0.1.0"
description = "Lavande — client mail Rust + Tauri (Orchidée en thème sombre)"
authors = ["Roman"]
edition = "2021"

[lib]
name = "lavande_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
lavande-mail = { path = "../crates/mail-core" }
lavande-mail-api = { path = "../crates/mail-api" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.3"
base64 = "0.21"
open = "5"
url = "2"

# Pont JNI du widget : la synchro de fond (WorkManager) appelle le Rust sans
# WebView.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Portal OpenURI : la voie canonique Wayland pour ouvrir un lien.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"

[profile.dev]
strip = "debuginfo"

[profile.release]
strip = true

# Workspace autonome : sans cette table, cargo remonte au workspace parent
# (faux en worktree imbriqué, le exclude du manifeste parent ne couvre pas ce chemin).
[workspace]
