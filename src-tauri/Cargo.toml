[package]
name = "lavande"
version = "0.1.0"
description = "Lavande — client mail Rust + Tauri (Orchidée en thème sombre)"
authors = ["Roman"]
edition = "2021"

[lib]
name = "lavande_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
strip = "debuginfo"

[profile.release]
strip = true
