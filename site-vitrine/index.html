<!doctype html>
<html lang="fr" data-theme="dark" data-type="software">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lavande — mail, agenda et planification, chiffrés et auto-hébergés</title>
    <meta
      name="description"
      content="Lavande réunit le mail IMAP/SMTP, l’agenda CalDAV/Google/ICS et la planification kanban dans une application de bureau et Android. PGP par compte, secrets dans le trousseau système, paquets et mises à jour signés."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#0e0c13" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Lavande — mail, agenda et planification" />
    <meta
      property="og:description"
      content="Le mail, l’agenda et la planification réunis. Chiffré par compte, assisté par l’IA que vous choisissez. Auto-hébergé."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var SITE_KEY = "lavande.site.theme";
        var DEMO_KEY = "lavande.theme";
        var root = document.documentElement;
        var theme = "dark";
        try {
          var stored = localStorage.getItem(SITE_KEY);
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (error) {}
        root.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fbfaff" : "#0e0c13");
        try {
          var demo = {};
          var raw = localStorage.getItem(DEMO_KEY);
          if (raw) demo = JSON.parse(raw) || {};
          demo.mode = theme;
          localStorage.setItem(DEMO_KEY, JSON.stringify(demo));
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
