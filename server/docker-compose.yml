services:
  db:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: lavande
      POSTGRES_PASSWORD: lavande
      POSTGRES_DB: lavande_sync
    volumes:
      - lavande_sync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavande -d lavande_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lavande_sync_pgdata:
