[package]
name = "lavande-sync"
version = "0.5.11"
edition = "2021"
description = "Serveur de synchronisation chiffrée de Lavande"
publish = false

[[bin]]
name = "lavande-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
http-body-util = "0.1"
rand = "0.8"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

# Workspace autonome : sans cette table, cargo remonte au workspace parent
# (faux en worktree imbriqué, le exclude du manifeste parent ne couvre pas ce chemin).
[workspace]
