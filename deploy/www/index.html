<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portail dev · int.lanro.eu</title>
    <style>
      :root {
        --accent: #8b7cf6;
        --ink: #1b1523;
        --ink-soft: #6b6478;
        --line: #ece8f5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 0%, color-mix(in oklab, var(--accent) 14%, white), transparent 60%),
          #fbfaff;
      }
      main {
        width: 100%;
        max-width: 30rem;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      p.lead {
        margin-top: 0.4rem;
        font-size: 0.85rem;
        color: var(--ink-soft);
      }
      ul {
        list-style: none;
        margin-top: 1.75rem;
        padding: 0;
        display: grid;
        gap: 0.6rem;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: #fff;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      a:hover {
        border-color: color-mix(in oklab, var(--accent) 40%, white);
        box-shadow: 0 12px 30px -22px var(--accent);
      }
      a strong {
        font-size: 0.95rem;
      }
      a span {
        font-size: 0.75rem;
        color: var(--ink-soft);
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portail dev</h1>
      <p class="lead">Serveur de développement — projets servis sous <code>/préfixe/</code>.</p>
      <ul>
        <li>
          <a href="/lavande/">
            <strong>Lavande / Orchidée</strong>
            <span><span class="dot"></span> /lavande/</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
