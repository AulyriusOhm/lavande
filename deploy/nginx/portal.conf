server {
    listen 8443 ssl;
    http2 on;
    # plasma.* existe déjà dans le DNS interne ; dev.* reste déclaré pour le jour où
    # l'enregistrement OPNsense sera créé (même portail dans les deux cas).
    server_name plasma.int.lanro.eu dev.int.lanro.eu;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv;
    index index.html;
    charset utf-8;

    # Chaque projet de dev : un préfixe, un dev server.
    location /lavande/ {
        proxy_pass http://127.0.0.1:1420;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
