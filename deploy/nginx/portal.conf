# L'API mail du démon ne s'authentifie pas toute seule derrière ce portail : le
# jeton Bearer est injecté par nginx (lavande-token.inc). L'URL du portail ne doit
# donc pas offrir une API mail ouverte.
#
# Deux protections "classiques" sont inopérantes ici :
# - une allow-list d'IP : tout client distant arrive par le tunnel SSH inversé,
#   donc vu depuis 127.0.0.1, et les postes du LAN sortent par MASQUERADE ;
# - une auth_basic : elle exige un dialogue que `EventSource` et le HMR Vite ne
#   peuvent pas mener (401 sans possibilité de répondre), et le front n'est pas
#   modifiable ici.
#
# Le seul discriminant fiable est donc posé par le navigateur lui-même :
# `Sec-Fetch-Site` (inforgeable depuis une page) vaut same-origin pour le SPA
# servi par ce portail. `Referer` sert de repli pour les navigateurs qui
# n'envoient pas encore les métadonnées Fetch (Safari < 16.4). Une navigation
# directe vers l'URL, un scan ou un `curl` n'ont ni l'un ni l'autre : 403.
map $http_sec_fetch_site $lavande_api_from_portal {
    default        0;
    "same-origin"  1;
    "same-site"    1;
}

map $http_referer $lavande_api_from_referer {
    default 0;
    "~^https?://(plasma\.int\.lanro\.eu|dev\.int\.lanro\.eu|10\.1\.50\.10|localhost)(:[0-9]+)?/lavande(/|$)" 1;
}

# `if` n'accepte pas une concaténation de variables : ce dernier map fusionne
# les deux signaux en un seul indicateur.
map "$lavande_api_from_portal$lavande_api_from_referer" $lavande_api_allowed {
    default 0;
    "~1"    1;
}

server {
    listen 8443 ssl;
    http2 on;
    # plasma.* existe déjà dans le DNS interne ; dev.* reste déclaré pour le jour où
    # l'enregistrement OPNsense sera créé (même portail dans les deux cas).
    server_name plasma.int.lanro.eu dev.int.lanro.eu;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv;
    index index.html;
    charset utf-8;

    # Chaque projet de dev : un préfixe, un dev server.
    # API du démon mail local (lavande-maild, 127.0.0.1:8790). Le jeton Bearer
    # est injecté par lavande-token.inc (généré par dev-proxy.sh, 0600, jamais
    # versionné) : la requête doit venir du SPA de ce portail, pas d'une URL
    # saisie à la main ni d'un site tiers (voir les map ci-dessus).
    location /lavande/api/ {
        if ($lavande_api_allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8790/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        include /etc/nginx/conf.d/lavande-token.inc;
    }

    # Retour OAuth : le navigateur système y arrive par une navigation directe
    # (`Sec-Fetch-Site: none`), donc hors du contrôle ci-dessus. Sa protection est
    # le `state` PKCE à usage unique du démon, comme sur la boucle locale.
    location = /lavande/api/oauth/callback {
        proxy_pass http://127.0.0.1:8790/api/oauth/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        include /etc/nginx/conf.d/lavande-token.inc;
    }


    # Maquette Desktop du worktree feat/hybrid-decision-ai (port 1425) :
    # redirige /lavande/decision_ia directement sur la vue bureau (?desktop).
    location = /lavande/decision_ia {
        return 302 /lavande/decision_ia/?desktop;
    }

    location /lavande/decision_ia/ {
        proxy_pass http://127.0.0.1:1425;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /lavande/ {
        proxy_pass http://127.0.0.1:1420;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Branche main (maquette + synchro) pendant qu'un worktree occupe /lavande/ :
    #   VITE_BASE=/lavande-main/ vite --port 1422 --host 0.0.0.0
    location /lavande-main/ {
        proxy_pass http://127.0.0.1:1422;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # maquette_editor : maquettes HTML/CSS/JS écrites par un LLM (MCP) puis
    # retouchées à la souris dans le navigateur. L'app sert ses propres routes
    # sous /editor_web (MQ_BASE_PATH), donc pas de réécriture de chemin ici ;
    # l'Upgrade est indispensable (rechargement live de l'éditeur en WebSocket).
    location = /editor_web {
        return 301 /editor_web/;
    }

    location /editor_web/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # URL stable de la maquette « Widget Android » : redirige vers son éditeur
    # maquette-editor (l'app sert ses assets sous /editor_web, un proxy direct
    # sous /widget casserait les chemins).
    location ~ ^/widget/?$ {
        return 302 /editor_web/e/widget-lavande;
    }
}
