[package]
name = "lavande-mail"
version = "0.1.0"
edition = "2021"
description = "Mail core for Lavande: model, MIME parsing, threading and local store"

[lib]
name = "lavande_mail"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
mail-parser = "0.9"
ammonia = "4"
cssparser = { version = "0.38", default-features = false }
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
pgp = { version = "0.21", default-features = false }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
