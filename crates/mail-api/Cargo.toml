[package]
name = "lavande-mail-api"
version = "0.1.0"
edition = "2021"
description = "HTTP API for the Lavande mail daemon"

[lib]
name = "lavande_mail_api"
path = "src/lib.rs"

[[bin]]
name = "lavande-maild"
path = "src/main.rs"

[dependencies]
lavande-mail = { path = "../mail-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
futures = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
