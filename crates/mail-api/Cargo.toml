[package]
name = "lavande-mail-api"
version = "0.5.9"
edition = "2021"
description = "HTTP API for the Lavande mail daemon"

[lib]
name = "lavande_mail_api"
path = "src/lib.rs"

[[bin]]
name = "lavande-maild"
path = "src/main.rs"

[dependencies]
lavande-mail = { path = "../mail-core" }
axum = "0.8"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
futures = "0.3"
quick-xml = "0.42"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
url = "2"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "0.26"

# Trousseau système (Secret Service) en pur Rust, desktop Linux uniquement.
# Android et les environnements sans D-Bus utilisent le fichier chiffré.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "crypto-rust"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
